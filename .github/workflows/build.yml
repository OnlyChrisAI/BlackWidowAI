name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip libffi-dev libssl-dev libncurses5 libncursesw5-dev zlib1g-dev libtool autoconf automake cmake pkg-config
          pip3 install --upgrade Cython==0.29.33 buildozer
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlackWidow-APK
          path: bin/*.apk
